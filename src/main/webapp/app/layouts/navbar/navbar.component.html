<nav data-cy="navbar" class="navbar navbar-expand-lg navbar-dark navbar-glass">
  <div class="container-fluid">
    <a class="navbar-brand nav-brand" routerLink="/chat" (click)="collapseNavbar()">
      <span class="brand-icon">
        <i class="fas fa-magic"></i>
      </span>
      <span class="brand-copy">
        <span class="brand-title">LaunchDarkly Portal</span>
        <span class="brand-subtitle">Crafted with a touch of Disney magic</span>
      </span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleNavbar()"
      [attr.aria-expanded]="!isNavbarCollapsed()"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isNavbarCollapsed()">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-4">
        <li class="nav-item">
          <a class="nav-link nav-pill" routerLink="/chat" (click)="collapseNavbar()">
            <i class="fas fa-comments me-2"></i>
            Chat Studio
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link nav-pill"
            href="https://disneyworld.disney.go.com/help/"
            target="_blank"
            rel="noopener"
          >
            <i class="fas fa-book me-2"></i>
            Help Center
          </a>
        </li>

        <li class="nav-item">
          <button
            class="btn btn-theme-toggle"
            type="button"
            (click)="toggleTheme()"
            [attr.aria-pressed]="isDarkMode()"
          >
            <i class="me-2" [ngClass]="getThemeToggleIcon()"></i>
            {{ getThemeToggleLabel() }}
          </button>
        </li>

        @if (userContext()?.email) {
          <li class="nav-item nav-user">
            <div class="user-chip">
              <div class="user-avatar">
                <span>{{ userContext()?.email?.charAt(0) | uppercase }}</span>
              </div>
              <div class="user-meta">
                <span class="user-email">{{ userContext()?.email }}</span>
                @if (getTierLabel()) {
                  <span [class]="getTierBadgeClass()" class="tier-badge">{{ getTierLabel() }}</span>
                }
              </div>
            </div>
          </li>

          <li class="nav-item">
            <button class="btn btn-logout" type="button" (click)="logout()">
              <i class="fas fa-sign-out-alt me-2"></i>
              Logout
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="btn btn-login" routerLink="/login" (click)="collapseNavbar()">
              <i class="fas fa-sign-in-alt me-2"></i>
              Login
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
