<nav data-cy="navbar" class="navbar navbar-expand-md navbar-dark bg-gradient">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/login" (click)="collapseNavbar()">
      <i class="fas fa-flag-checkered me-2"></i>
      LaunchDarkly Demo
    </a>
    
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleNavbar()"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isNavbarCollapsed()">
      <ul class="navbar-nav ms-auto align-items-center">
        @if (userContext()?.email) {
          <li class="nav-item me-3">
            <span class="navbar-text text-white">
              <i class="fas fa-user me-2"></i>
              <strong>{{ userContext()?.email }}</strong>
              @if (getTierLabel()) {
                <span [class]="getTierBadgeClass()">{{ getTierLabel() }}</span>
              }
            </span>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" routerLink="/chat" (click)="collapseNavbar()">
              <i class="fas fa-comments me-1"></i>
              Chat
            </a>
          </li>

          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="logout()">
              <i class="fas fa-sign-out-alt me-1"></i>
              Logout
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm" routerLink="/login" (click)="collapseNavbar()">
              <i class="fas fa-sign-in-alt me-1"></i>
              Login
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
